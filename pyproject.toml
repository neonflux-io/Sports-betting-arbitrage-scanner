[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-betting-arbitrage-scanner"
version = "1.0.0"
description = "Cross-bookmaker arbitrage scanner for Australian sports betting markets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hayden RW" }]
keywords = ["arbitrage", "sports-betting", "odds", "python", "api"]
dependencies = [
  "requests>=2.31.0",
  "tabulate>=0.9.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
arb-scanner = "arb_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["arb_scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
